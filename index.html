<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Breezalit – Premium ceiling fans, exhaust fans & BLDC fans for modern homes" />
  <title>Breezalit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <!-- GSAP Cinematic Splash Screen -->
  <div id="splash-screen">
    <div class="splash-particles" id="splash-particles"></div>
    <div class="splash-fan" id="splash-fan">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="14" fill="#f26522" />
        <circle cx="100" cy="100" r="7" fill="#d4520e" />
        <!-- Blade 1 (top) -->
        <path d="M94 86 C88 50, 106 18, 120 30 C130 38, 112 68, 106 86Z" fill="#f26522" opacity="0.92" />
        <!-- Blade 2 (right) -->
        <path d="M114 94 C150 88, 182 106, 170 120 C162 130, 132 112, 114 106Z" fill="#f26522" opacity="0.78" />
        <!-- Blade 3 (bottom) -->
        <path d="M106 114 C112 150, 94 182, 80 170 C70 162, 88 132, 94 114Z" fill="#f26522" opacity="0.92" />
        <!-- Blade 4 (left) -->
        <path d="M86 106 C50 112, 18 94, 30 80 C38 70, 68 88, 86 94Z" fill="#f26522" opacity="0.78" />
      </svg>
    </div>
    <h1 class="splash-brand" id="splash-brand">
      <span class="splash-b">B</span><span class="splash-r">r</span><span class="splash-e">e</span><span
        class="splash-e2">e</span><span class="splash-z">z</span><span class="splash-a">a</span><span
        class="splash-l">l</span><span class="splash-i">i</span><span class="splash-t">t</span>
    </h1>
    <div class="splash-tagline" id="splash-tagline">Premium Cooling Experience</div>
    <div class="splash-line" id="splash-line"></div>
  </div>

  <!-- Fixed Header -->
  <header class="app-header" id="app-header">
    <a href="#/" class="header-brand">
      <span class="brand-gro">Breezalit</span>
      
    </a>
    <div class="header-actions">
      <a href="#/tracking" class="header-icon-btn" id="btn-tracking" aria-label="Tracking">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="1" y="3" width="15" height="13" />
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
          <circle cx="5.5" cy="18.5" r="2.5" />
          <circle cx="18.5" cy="18.5" r="2.5" />
        </svg>
      </a>
      <button class="header-icon-btn" id="btn-search" aria-label="Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
      <button class="header-icon-btn" id="btn-wishlist-header" aria-label="Wishlist">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Search Overlay -->
  <div class="search-overlay" id="search-overlay">
    <div class="search-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search-input" placeholder="Search fans, products..." autocomplete="off" />
      <button id="search-close" class="search-close">Cancel</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>

  <!-- Page Content -->
  <main id="page-content" class="page-content">
    <div class="initial-loader">
      <div class="loader-logo">
        <span class="brand-gro">Breezalit</span>
      </div>
      <div class="spinner"></div>
      <p>Loading your experience...</p>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#/" class="nav-item active" data-tab="home">
      <div class="nav-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </div>
      <span>Home</span>
    </a>
    <a href="#/shop" class="nav-item" data-tab="shop">
      <div class="nav-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
      </div>
      <span>Shop</span>
    </a>
    <a href="#/cart" class="nav-item nav-cart" data-tab="cart">
      <div class="nav-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span class="cart-badge" id="cart-badge" style="display:none">0</span>
      </div>
      <span>Cart</span>
    </a>
    <a href="#/about" class="nav-item" data-tab="about">
      <div class="nav-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <span>About</span>
    </a>
  </nav>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
